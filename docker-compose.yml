version: "3.9"

services:
  sentiment:
    build:
      context: .
      dockerfile: docker/sentiment.Dockerfile
    environment:
      SENTIMENT_SERVICE_HOST: "0.0.0.0"
      SENTIMENT_SERVICE_PORT: "5000"
    expose:
      - "5000"

  mongodb:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      NODE_ENV: "production"
      PORT: "3600"
      DB_URL: ${DB_URL:-mongodb://mongodb:27017/rentwise}
      SESSION_SECRET: ${SESSION_SECRET:-local-session-secret}
      JWT_API_SECRET_KEY: ${JWT_API_SECRET_KEY:-local-jwt-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Changeme123!}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:4000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4000}
      SOCKET_ALLOWED_ORIGINS: ${SOCKET_ALLOWED_ORIGINS:-http://localhost:4000}
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/server/uploads}
      AI_MODEL_PORT: ${AI_MODEL_PORT:-http://sentiment:5000}
    ports:
      - "3600:3600"
    volumes:
      - ./server/uploads:/app/server/uploads
    depends_on:
      - sentiment
      - mongodb

volumes:
  mongo-data:

