<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Listing</title>
</head>
<body>
    <h1>Create a New Listing</h1>
    <form action="http://localhost:3600/listings/create" method="POST" enctype="multipart/form-data">
        <label for="owner">Owner ID:</label>
        <input type="text" id="owner" name="owner" value="670ae1d5f3fc909c0efe0413" required><br><br> <!-- Default value for owner ID -->

        <label for="title">Title:</label>
        <input type="text" id="title" name="title" value="Luxury Apartment in Downtown" required><br><br>

        <label for="description">Description:</label>
        <textarea id="description" name="description" required>A spacious 2-bedroom apartment located in the heart of the city.</textarea><br><br>

        <label for="price">Price:</label>
        <input type="number" id="price" name="price" value="1200" required><br><br>

        <label for="priceUnit">Price Unit:</label>
        <select id="priceUnit" name="priceUnit" required>
            <option value="hour" selected>Hour</option>
            <option value="day">Day</option>
            <option value="week">Week</option>
            <option value="month">Month</option>
        </select><br><br>

        <label for="category">Category:</label>
        <select id="category" name="category" required>
            <option value="apartment" selected>Apartment</option>
            <option value="car">Car</option>
            <option value="bike">Bike</option>
            <option value="hotel">Hotel</option>
            <option value="house">House</option>
            <option value="other">Other</option>
        </select><br><br>

        <label for="location">Location (JSON):</label>
        <input type="text" id="location" name="location" value='{"address": "123 Main St", "city": "New York", "state": "NY", "country": "USA", "zipCode": "10001", "coordinates": {"latitude": 40.712776, "longitude": -74.005974}}' ><br><br>

        <label for="amenities">Amenities (comma-separated):</label>
        <input type="text" id="amenities" name="amenities" value="WiFi, Pool, Gym" required><br><br>

        <label for="rules">Rules (comma-separated):</label>
        <input type="text" id="rules" name="rules" value="No smoking, No pets" required><br><br>

        <label for="availability">Availability (JSON):</label>
        <input type="text" id="availability" name="availability" placeholder='[{"startDate": "2024-10-16T00:00:00Z", "endDate": "2024-10-20T00:00:00Z"}]'><br><br>
        
        <label for="ratings">Ratings (JSON):</label>
        <input type="text" id="ratings" name="ratings" placeholder='[{"user": "userId", "rating": 5, "review": "Excellent!"}]'><br><br>
        
        <label for="averageRating">Average Rating:</label>
        <input type="number" id="averageRating" name="averageRating" value="4.9" required step="0.1"><br><br>
        
        <label for="status">Status:</label>
        <select id="status" name="status" required>
            <option value="active" selected>Active</option>
            <option value="pending">Pending</option>
            <option value="inactive">Inactive</option>
        </select><br><br>

        <label for="images">Upload Images:</label>
        <input type="file" id="images" name="images" accept="image/*" multiple><br><br>
    
        <label for="videos">Upload Videos:</label>
        <input type="file" id="videos" name="videos" accept="video/*" multiple><br><br>

            <!-- Bidding Section -->
            <h2>Bidding Settings</h2>
        
            <label for="biddingEnabled">Enable Bidding:</label>
            <select id="biddingEnabled" name="biddingEnabled" required>
                <option value="false" selected>No</option>
                <option value="true">Yes</option>
            </select><br><br>

            <label for="minimumBid">Minimum Bid:</label>
            <input type="number" id="minimumBid" name="minimumBid" step="0.01"><br><br>

            <label for="bidIncrement">Bid Increment:</label>
            <input type="number" id="bidIncrement" name="bidIncrement" step="0.01"><br><br>

            <label for="bidEndDate">Bidding End Date:</label>
            <input type="datetime-local" id="bidEndDate" name="bidEndDate"><br><br>



        <button type="submit">Submit</button>
    </form>
</body>
</html>
