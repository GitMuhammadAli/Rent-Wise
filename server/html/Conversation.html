<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat with Users</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
    }

    .sidebar {
      width: 250px;
      background-color: #333;
      color: #fff;
      padding: 20px;
      height: 100vh;
    }

    .sidebar h2 {
      margin-top: 0;
    }

    .sidebar ul {
      padding-left: 0;
      list-style: none;
    }

    .sidebar ul li {
      padding: 10px;
      cursor: pointer;
    }

    .sidebar ul li:hover {
      background-color: #444;
    }

    .chat-container {
      flex-grow: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .chat-box {
      flex-grow: 1;
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 20px;
      overflow-y: auto;
      height: 400px;
    }

    .chat-form {
      display: flex;
      flex-direction: column;
    }

    .chat-form input,
    .chat-form textarea,
    .chat-form button {
      padding: 10px;
      margin-bottom: 10px;
      width: 100%;
    }

    .chat-form button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }

    .chat-form button:hover {
      background-color: #45a049;
    }
  </style>
</head>

<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Users</h2>
    <input type="text" id="userIdSidebar" placeholder="Enter User ID">
    <button onclick="loadParticipants()">Load Participants</button>
    <ul id="participantsList">

    </ul>
  </div>

  <!-- Chat Container -->
  <div class="chat-container">
    <h1>Chat with Owner</h1>

    <!-- Load Chat History Input -->
    <div class="chat-form" style="margin-bottom: 20px;">
      <h3>Load Chat</h3>
      <input type="text" id="loadOwnerId" placeholder="Enter Owner ID">
      <input type="text" id="loadListingId" placeholder="Enter Listing ID">
      <input type="text" id="loadReceiverId" placeholder="Enter Receiver ID">
      <input type="text" id="loadUserId" placeholder="Enter logged ID">
      <button onclick="loadChatHistory(document.getElementById('loadReceiverId').value)">Load Chat History</button>
    </div>

    <div class="chat-box" id="chatBox">
      <!-- Messages will appear here -->
    </div>

    <!-- Message Input Form -->
    <div class="chat-form">
      <h3>Send Message</h3>
      <input type="text" id="sendOwnerId" placeholder="Enter Owner ID">
      <input type="text" id="sendReceiverId" placeholder="Enter Receiver ID">
      <input type="text" id="sendListingId" placeholder="Enter Listing ID">
      <input type="text" id="sendUserId" placeholder="Enter logged ID">
      <textarea id="message" placeholder="Enter your message" rows="4"></textarea>
      <button onclick="sendMessage()">Send Message</button>
    </div>
  </div>

  <script>
    // Load chat participants
    async function loadParticipants() {
      const userId = document.getElementById('userIdSidebar').value;

      if (!userId) {
        alert("Please enter a valid User ID.");
        return;
      }

      try {
        const response = await fetch('http://localhost:3600/chats/sidebar', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            userId:userId
          }),
        });

        const data = await response.json();
        const participantsList = document.getElementById('participantsList');
        participantsList.innerHTML = '';
        console.log(data);

        if (data && Array.isArray(data.participants)) {
          // Loop through the participants and display them
          data.participants.forEach(participant => {
            const li = document.createElement('li');
            li.innerHTML = `
              <img src="${participant.avatar}" alt="${participant.name}" style="width: 30px; height: 30px; border-radius: 50%;">
              ${participant.name}
            `;
            li.addEventListener('click', () => {
              document.getElementById('loadReceiverId').value = participant._id;
              loadChatHistory(participant._id);
            });
            participantsList.appendChild(li);
          });
        } else {
          console.error('Invalid participants data:', data);
          participantsList.innerHTML = '<li>No participants found</li>';
        }
      } catch (error) {
        console.error('Error loading participants:', error);
      }
    }




    // Load chat history when a participant is clicked
    async function loadChatHistory(receiverId) {
      const userId = document.getElementById("loadUserId").value;
      const listingId = document.getElementById("loadListingId").value;


      try {
        const response = await fetch(`http://localhost:3600/chats/getMessages/${receiverId}/${listingId}/${userId}`);
        const data = await response.json();




        if (data.success) {
          const chatBox = document.getElementById("chatBox");
          chatBox.innerHTML = ""; // Clear existing messages


          data.messages.forEach(msg => {
            const div = document.createElement("div");
            div.textContent = `${msg.sender.name}: ${msg.message}`;
            chatBox.appendChild(div);
          });
        } else {
          console.error("Error:", data.error);
        }
      } catch (error) {
        console.error("Failed to load chat history:", error);
      }


    }


    // Receive message function to display new message in the chat box
    function receiveMessage(sender, message) {
      const chatBox = document.getElementById("chatBox");
      const messageElement = document.createElement("div");
      messageElement.textContent = `${sender}: ${message}`;
      chatBox.appendChild(messageElement);
    }

    // Send message function
    async function sendMessage() {
      const ownerId = document.getElementById("sendOwnerId").value;
      const receiverId = document.getElementById("sendReceiverId").value;
      const listingId = document.getElementById("sendListingId").value;
      const message = document.getElementById("message").value;
      const userId = document.getElementById('sendUserId').value;

      const data = {
        ownerId: ownerId || '',
        receiver: receiverId,
        message,
        listing: listingId || '',
        senderId: userId || ''
      };

      console.log('Sending message:', data);

      try {
        const response = await fetch('http://localhost:3600/chats/createMessage', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data),
        });

        const result = await response.json();
        console.log('Message sent successfully:', result);
        receiveMessage('You', message);

        // Clear message input after sending
        document.getElementById("message").value = '';

        // Reload chat history after sending message
        loadChatHistory(receiverId);
      } catch (error) {
        console.error('Error sending message:', error);
      }
    }
  </script>
</body>

</html>
