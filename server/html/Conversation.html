<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.io Test</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #messages {
            border: 1px solid #ccc;
            padding: 10px;
            height: 300px;
            overflow-y: scroll;
            margin-bottom: 20px;
        }
        #inputSection {
            display: flex;
            gap: 10px;
        }
        input {
            padding: 10px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Socket.io Chat Test</h1>
    <div>
        <label for="roomId">Conversation ID: </label>
        <input type="text" id="roomId" placeholder="Enter room ID">
        <button onclick="joinRoom()">Join Room</button>
    </div>
    <div id="messages"></div>
    <div id="inputSection">
        <input type="text" id="messageInput" placeholder="Type your message">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const socket = io("http://localhost:3600"); // Replace with your backend server URL if different

        const roomIdInput = document.getElementById("roomId");
        const messageInput = document.getElementById("messageInput");
        const messagesDiv = document.getElementById("messages");

        let currentRoomId = null;

        // Connect to the socket.io server
        socket.on("connect", () => {
            console.log("Connected to server:", socket.id);
        });

        // Listen for new messages
        socket.on("newMessage", (data) => {
            const messageElement = document.createElement("p");
            messageElement.textContent = `(${data.sender}): ${data.message}`;
            messagesDiv.appendChild(messageElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight; // Auto-scroll
        });

        // Join a conversation room
        function joinRoom() {
            const roomId = roomIdInput.value.trim();
            if (!roomId) {
                alert("Please enter a room ID");
                return;
            }
            currentRoomId = roomId;
            socket.emit("join-conversation", roomId);
            console.log(`Joined room: ${roomId}`);
        }

        // Send a message
        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || !currentRoomId) {
                alert("Please enter a message and join a room first.");
                return;
            }
            const data = {
                sender: socket.id,
                message: message,
                conversationId: currentRoomId,
            };
            socket.emit("sendMessage", data);
            messageInput.value = ""; // Clear the input
        }

        // Handle disconnection
        socket.on("disconnect", () => {
            console.log("Disconnected from server");
        });
    </script>
</body>
</html>
