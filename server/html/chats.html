<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat with Users</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
    }
    .sidebar {
      width: 250px;
      background-color: #333;
      color: #fff;
      padding: 20px;
      height: 100vh;
    }
    .sidebar h2 {
      margin-top: 0;
    }
    .sidebar ul {
      padding-left: 0;
      list-style: none;
    }
    .sidebar ul li {
      padding: 10px;
      cursor: pointer;
    }
    .sidebar ul li:hover {
      background-color: #444;
    }
    .chat-container {
      flex-grow: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .chat-box {
      flex-grow: 1;
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 20px;
      overflow-y: auto;
      height: 400px;
    }
    .chat-form {
      display: flex;
      flex-direction: column;
    }
    .chat-form input, .chat-form textarea, .chat-form button {
      padding: 10px;
      margin-bottom: 10px;
      width: 100%;
    }
    .chat-form button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    .chat-form button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Users</h2>
    <input type="text" id="userId" placeholder="Enter logged in User ID">
    <ul id="participantsList">
      <!-- Participants will be loaded here -->
    </ul>
  </div>

  <!-- Chat Container -->
  <div class="chat-container">
    <h1>Chat with Owner</h1>

    <div class="chat-box" id="chatBox">
      <!-- Messages will appear here -->
    </div>

    <!-- Message Input Form -->
    <div class="chat-form">
      <input type="text" id="userId" placeholder="Enter logged in user ID">
      <input type="text" id="ownerId" placeholder="Enter Owner ID">
      <input type="text" id="listingId" placeholder="Enter Listing ID">
      <input type="text" id="receiverId" placeholder="Enter Receiver ID">
      <textarea id="message" placeholder="Enter your message" rows="4"></textarea>
      <button onclick="sendMessage()">Send Message</button>
    </div>
  </div>

  <script>
    // Load chat participants
    async function loadParticipants() {
      try {
        const userId = document.getElementById('userId').value;        const response = await fetch('/api/messages/participants', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ userId }),
        });

        const data = await response.json();
        const participantsList = document.getElementById('participantsList');
        participantsList.innerHTML = '';

        data.participants.forEach(participant => {
          const li = document.createElement('li');
          li.innerHTML = `
            <img src="${participant.avatar}" alt="${participant.name}" style="width: 30px; height: 30px; border-radius: 50%;">
            ${participant.name}
          `;
          participantsList.appendChild(li);
        });
      } catch (error) {
        console.error('Error loading participants:', error);
      }
    }

    // Load participants when page loads
    document.addEventListener('DOMContentLoaded', loadParticipants);

    function receiveMessage(sender, message) {
      const chatBox = document.getElementById("chatBox");
      const messageElement = document.createElement("div");
      messageElement.textContent = `${sender}: ${message}`;
      chatBox.appendChild(messageElement);
    }

    async function sendMessage() {
      const ownerId = document.getElementById("ownerId").value;
      const listingId = document.getElementById("listingId").value;
      const receiverId = document.getElementById("receiverId").value;
      const message = document.getElementById("message").value;

      const data = {
        ownerId,
        message,
        listing: listingId,
        receiver: receiverId,
      };

      console.log('Sending message:', data);

      try {
        const response = await fetch('/api/messages/create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data),
        });

        const result = await response.json();
        console.log('Message sent successfully:', result);
        receiveMessage('You', message);
        
        // Reload participants after sending message
        loadParticipants();
      } catch (error) {
        console.error('Error sending message:', error);
      }
    }
  </script>
</body>
</html>
